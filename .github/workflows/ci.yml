name: mf2005 checks
on:
  # run at 6 AM UTC every day
  schedule:
    - cron: '0 6 * * *'
  push:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  PIXI_BETA_WARNING_OFF: true
  DIST: dist-${{ github.run_number }}
  PROGRAM_NAME: mf2005

jobs:
  build:
    name: ${{ matrix.compiler }} ${{ matrix.version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, compiler: gcc, version: 13, shell: bash, release: no}
          - {os: macos-14, compiler: gcc, version: 13, shell: bash, release: yes}
          - {os: macos-15-intel, compiler: gcc, version: 13, shell: bash, release: yes}
          - {os: ubuntu-22.04, compiler: intel, version: "2025.2", shell: bash, release: yes}
          - {os: windows-2022, compiler: intel, version: "2025.2", shell: pwsh, release: yes}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout mf2005
        uses: actions/checkout@v4
        with:
          path: ${{ env.PROGRAM_NAME }}

      - name: Setup ${{ matrix.compiler }} ${{ matrix.version }}
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.version }}

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.41.4
          manifest-path: "${{ env.PROGRAM_NAME }}/pixi.toml"

      - name: Set ostag
        working-directory: ${{ env.PROGRAM_NAME }}
        id: ostag
        run: |
          echo "ostag=$(pixi run get-ostag)" >> $GITHUB_ENV

      # static link gfortran libs
      - name: Hide dylibs (macOS)
        if: runner.os == 'macOS'
        working-directory: ${{ env.PROGRAM_NAME }}
        run: |
          version="${{ matrix.version }}"
          brew_prefix="$(brew --prefix)"
          libpath="$brew_prefix/opt/gcc@$version/lib/gcc/$version"
          mv $libpath/libgcc_s.1.1.dylib $libpath/libgcc_s.1.1.dylib.bak
          mv $libpath/libgfortran.5.dylib $libpath/libgfortran.5.dylib.bak
          mv $libpath/libquadmath.0.dylib $libpath/libquadmath.0.dylib.bak
          mv $libpath/libstdc++.6.dylib $libpath/libstdc++.6.dylib.bak

      # static link libgcc
      - name: Set LDFLAGS (macOS)
        if: runner.os == 'macOS'
        run: |
          ldflags="$LDFLAGS -static-libgcc"
          echo "LDFLAGS=$ldflags" >> $GITHUB_ENV

      - name: Build single precision
        working-directory: ${{ env.PROGRAM_NAME }}
        run: |
          pixi run setup builddir
          pixi run build builddir

      - name: Build double precision
        working-directory: ${{ env.PROGRAM_NAME }}
        run: |
          pixi run setup builddir-dbl -Ddouble=true
          pixi run build builddir-dbl

      - name: Check architecture (macOS)
        working-directory: ${{ env.PROGRAM_NAME }}/bin
        if: runner.os == 'macOS'
        run: |
          otool -L mf2005
          otool -L mf2005dbl
          lipo -info mf2005
          lipo -info mf2005dbl

      - name: Show build log
        if: failure()
        working-directory: ${{ env.PROGRAM_NAME }}
        run: cat builddir/meson-logs/meson-log.txt

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.compiler}}-${{ matrix.version }}-meson-log.txt
          path: ${{ env.PROGRAM_NAME }}/builddir/meson-logs/meson-log.txt

      - name: Install reference executable
        uses: modflowpy/install-modflow-action@v1
        with:
          subset: mf2005
          path: ${{ env.PROGRAM_NAME }}/autotest/temp/release

      - name: Test applications
        working-directory: ${{ env.PROGRAM_NAME }}
        run: pixi run autotest

      - name: Create source zip file on Linux
        if: ${{ matrix.release == 'yes' && runner.os == 'Linux' }}
        working-directory: ${{ env.PROGRAM_NAME }}
        run: |
          zip -r ${{ env.PROGRAM_NAME }}_source.zip meson.build src/
          ls -lha *.zip

      - name: Create zip file on MacOS and Linux
        if: ${{ matrix.release == 'yes' && runner.os != 'Windows' }}
        working-directory: ${{ env.PROGRAM_NAME }}
        run: |
          zip -r -j ${ostag}.zip bin/
          ls -lha *.zip

      - name: Create zip file on Windows
        if: ${{ matrix.release == 'yes' && runner.os == 'Windows' }}
        working-directory: ${{ env.PROGRAM_NAME }}
        run: |
          $ZipFileName = "$env:ostag.zip"
          Compress-Archive -Path "bin\*" -DestinationPath $ZipFileName
          ls *.zip

      - name: Upload distribution archive
        if: matrix.release == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DIST }}-${{ matrix.os }}
          path: ${{ env.PROGRAM_NAME }}/*.zip

  release:
    name: Draft release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout mf2005
        uses: actions/checkout@v4

      - name: Get version
        id: get-version
        run: |
          ver=$(grep "^  version:" meson.build | head -1 | sed "s/  version: '\(.*\)',/\1/g")
          echo "version=$ver" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ env.DIST }}

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.get-version.outputs.version }}
          name: mf2005 ${{ steps.get-version.outputs.version }}
          body: MODFLOW-2005 version ${{ steps.get-version.outputs.version }}
          draft: true
          artifacts: ${{ env.DIST }}/**/*.zip
          allowUpdates: true
          updateOnlyUnreleased: true
